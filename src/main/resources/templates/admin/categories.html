<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/site :: head('Categories')}"></head><body class="dash-body"><div class="app-shell"><div th:replace="~{fragments/dashboard :: adminSidebar('categories')}"></div><main class="app-main dashboard-page"><div th:replace="~{fragments/dashboard :: topbar('Food categories','Catalog')}"></div><div th:replace="~{fragments/site :: flash}"></div><section class="dashboard-grid-2"><div class="panel"><div class="panel-head"><h2>Categories</h2></div><div class="table-wrap"><table><thead><tr><th>Name</th><th>Slug</th><th>Status</th><th></th></tr></thead><tbody><tr th:each="c:${categories}"><td><b th:text="${c.name}"></b></td><td><code th:text="${c.slug}"></code></td><td><span class="badge" th:classappend="${c.active ? 'success' : 'dark'}" th:text="${c.active ? 'Active' : 'Inactive'}"></span></td><td><form th:action="@{/admin/categories/{id}/toggle(id=${c.id})}" method="post"><button class="button small secondary" th:text="${c.active ? 'Disable' : 'Enable'}"></button></form></td></tr></tbody></table></div></div><aside class="panel"><span class="eyebrow">New category</span><h2>Add a catalog group</h2><form class="stack" th:action="@{/admin/categories}" method="post"><div class="field"><label>Name</label><input name="name" minlength="2" maxlength="80" required placeholder="e.g. Healthy bowls"/></div><button class="button">Create category</button></form></aside></section></main></div><script th:replace="~{fragments/site :: scripts}"></script></body></html>
